# ==================== SERVICE INFO ====================
spring.application.name=companyms
server.port=8082

# ==================== EUREKA CLIENT ====================
eureka.client.service-url.defaultZone=http://service-reg:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ==================== DATABASE ====================
spring.datasource.url=jdbc:postgresql://postgres:5432/jobapp
spring.datasource.username=postgres
spring.datasource.password=rYlI\&144   # Escape special character &
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================== ACTUATOR ====================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.shutdown.enabled=true

# ==================== TRACING & ZIPKIN ====================
management.tracing.enabled=true
management.tracing.sampler.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# ==================== SWAGGER / OPENAPI ====================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ==================== GRACEFUL SHUTDOWN ====================
server.shutdown=graceful
