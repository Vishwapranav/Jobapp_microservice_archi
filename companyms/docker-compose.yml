version: "3.9"

services:

  service-reg:
    build:
      context: ../service-reg
      dockerfile: Dockerfile
    container_name: service-reg
    ports:
      - "8761:8761"
    networks:
      - microservices-net

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobapp
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobapp"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservices-net

  companyms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: companyms
    depends_on:
      service-reg:
        condition: service_started
      postgres:
        condition: service_healthy
      zipkin:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      - EUREKA_SERVER=http://service-reg:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/jobapp
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_ZIPKIN_BASE_URL=http://zipkin:9411
    networks:
      - microservices-net

  jobms:
    build:
      context: ../jobms
      dockerfile: Dockerfile
    container_name: jobms
    depends_on:
      service-reg:
        condition: service_started
      postgres:
        condition: service_healthy
      zipkin:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      - EUREKA_SERVER=http://service-reg:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/jobapp
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_ZIPKIN_BASE_URL=http://zipkin:9411
    networks:
      - microservices-net

  reviewms:
    build:
      context: ../reviewms
      dockerfile: Dockerfile
    container_name: reviewms
    depends_on:
      service-reg:
        condition: service_started
      postgres:
        condition: service_healthy
      zipkin:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      - EUREKA_SERVER=http://service-reg:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/jobapp
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_ZIPKIN_BASE_URL=http://zipkin:9411
    networks:
      - microservices-net

  authms:
    build:
      context: ../authms
      dockerfile: Dockerfile
    container_name: authms
    depends_on:
      service-reg:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      - EUREKA_SERVER=http://service-reg:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/jobapp
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    networks:
      - microservices-net

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  postgres_data:
